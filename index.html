```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monaco Editor</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 868px;
    height: 436px;
    min-width: 868px;
    min-height: 436px;
    max-width: 868px;
    max-height: 436px;
    overflow: hidden;
    background: #0f0f0f;
    color: #d4d4d4;
    font-family: "Segoe UI", sans-serif;
}

#app {
    width: 868px;
    height: 436px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #0f0f0f;
    border: 1px solid #292929;
}

/* Tab bar */
#tabbar {
    height: 36px;
    min-height: 36px;
    display: flex;
    align-items: stretch;
    background: #111111;
    border-bottom: 1px solid #292929;
    overflow: hidden;
}

#tabs {
    display: flex;
    flex: 1;
    min-width: 0;
    overflow: hidden;
}

.tab {
    height: 35px;
    min-width: 100px;
    max-width: 180px;
    padding: 0 13px;
    display: flex;
    align-items: center;
    gap: 9px;
    border-right: 1px solid #242424;
    color: #777777;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
}

.tab:hover {
    background: #171717;
    color: #bbbbbb;
}

.tab.active {
    background: #0f0f0f;
    color: #eeeeee;
    border-top: 2px solid #d6d6d6;
    height: 36px;
}

.tab-name {
    overflow: hidden;
    text-overflow: ellipsis;
}

.tab-close {
    margin-left: auto;
    color: #777777;
    font-size: 15px;
    line-height: 1;
    padding: 2px;
}

.tab-close:hover {
    color: #ffffff;
}

#add-tab {
    width: 38px;
    min-width: 38px;
    border: none;
    outline: none;
    background: transparent;
    color: #858585;
    font-size: 20px;
    cursor: pointer;
}

#add-tab:hover {
    background: #1b1b1b;
    color: #ffffff;
}

/* Editor */
#editor {
    width: 100%;
    height: 377px;
    min-height: 0;
    flex: 1;
    overflow: hidden;
    background: #0f0f0f;
}

/* Status bar */
#statusbar {
    height: 23px;
    min-height: 23px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    background: #111111;
    border-top: 1px solid #292929;
    color: #777777;
    font-size: 10px;
    user-select: none;
}

.status-left, .status-right {
    display: flex;
    align-items: center;
    gap: 13px;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8a8a8a;
    display: inline-block;
    margin-right: 5px;
}

input.rename-input {
    width: 110px;
    border: 1px solid #444444;
    outline: none;
    background: #181818;
    color: #ffffff;
    font: inherit;
    padding: 2px 4px;
}
</style>
</head>

<body>
<div id="app">

    <div id="tabbar">
        <div id="tabs"></div>
        <button id="add-tab" title="New tab">+</button>
    </div>

    <div id="editor"></div>

    <div id="statusbar">
        <div class="status-left">
            <span><span class="status-dot"></span>Ready</span>
            <span id="cursor-position">Ln 1, Col 1</span>
        </div>
        <div class="status-right">
            <span>Lua</span>
            <span>UTF-8</span>
            <span id="line-count">1 line</span>
        </div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>

<script>
require.config({
    paths: {
        vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
    }
});

let editor;
let nextId = 2;
let activeTabId = 1;

const tabs = [
    {
        id: 1,
        name: "main.lua",
        content: ""
    }
];

const editorElement = document.getElementById("editor");
const tabsElement = document.getElementById("tabs");
const cursorPosition = document.getElementById("cursor-position");
const lineCount = document.getElementById("line-count");

require(["vs/editor/editor.main"], function () {
    monaco.languages.register({ id: "lua" });

    monaco.languages.setMonarchTokensProvider("lua", {
        keywords: [
            "and", "break", "do", "else", "elseif", "end",
            "false", "for", "function", "if", "in", "local",
            "nil", "not", "or", "repeat", "return", "then",
            "true", "until", "while"
        ],

        builtins: [
            "print", "pairs", "ipairs", "next", "type",
            "tostring", "tonumber", "select", "unpack",
            "pcall", "xpcall", "error", "assert",
            "math", "string", "table", "coroutine",
            "os", "io", "debug", "require"
        ],

        operators: [
            "+", "-", "*", "/", "%", "^", "#", "==",
            "~=", "<=", ">=", "<", ">", "=", "..", "..."
        ],

        tokenizer: {
            root: [
                [/--\[\[/, "comment", "@commentBlock"],
                [/--.*$/, "comment"],
                [/\[(=*)\[/, {
                    token: "string",
                    next: "@stringBlock.$1"
                }],
                [/"([^"\\]|\\.)*$/, "string.invalid"],
                [/'([^'\\]|\\.)*$/, "string.invalid"],
                [/"([^"\\]|\\.)*"/, "string"],
                [/'([^'\\]|\\.)*'/, "string"],
                [/\d+(\.\d+)?([eE][\-+]?\d+)?/, "number"],
                [/[a-zA-Z_]\w*/, {
                    cases: {
                        "@keywords": "keyword",
                        "@builtins": "predefined",
                        "@default": "identifier"
                    }
                }],
                [/[+\-*\/%#^=<>~]+/, "operator"],
                [/[{}()\[\]]/, "@brackets"],
                [/[;,.]/, "delimiter"]
            ],

            commentBlock: [
                [/\]\]/, "comment", "@pop"],
                [/./, "comment"]
            ],

            stringBlock: [
                [/\](@$)\]/, "string", "@pop"],
                [/./, "string"]
            ]
        }
    });

    monaco.editor.defineTheme("erys-dark", {
        base: "vs-dark",
        inherit: true,
        rules: [
            { token: "keyword", foreground: "C586C0" },
            { token: "predefined", foreground: "DCDCAA" },
            { token: "comment", foreground: "6A9955" },
            { token: "string", foreground: "CE9178" },
            { token: "number", foreground: "B5CEA8" }
        ],
        colors: {
            "editor.background": "#0f0f0f",
            "editor.foreground": "#d4d4d4",
            "editorLineNumber.foreground": "#505050",
            "editorLineNumber.activeForeground": "#bdbdbd",
            "editorCursor.foreground": "#ffffff",
            "editor.selectionBackground": "#333333",
            "editor.lineHighlightBackground": "#141414",
            "editorIndentGuide.background": "#252525",
            "editorIndentGuide.activeBackground": "#3a3a3a",
            "editorGutter.background": "#0f0f0f",
            "editorWidget.background": "#151515",
            "editorWidget.border": "#303030"
        }
    });

    editor = monaco.editor.create(editorElement, {
        value: "",
        language: "lua",
        theme: "erys-dark",
        automaticLayout: true,
        minimap: { enabled: false },
        fontSize: 13,
        fontFamily: "Consolas, 'Courier New', monospace",
        lineHeight: 20,
        tabSize: 4,
        insertSpaces: true,
        wordWrap: "off",
        scrollBeyondLastLine: false,
        renderLineHighlight: "line",
        roundedSelection: false,
        padding: {
            top: 10,
            bottom: 8
        },
        folding: true,
        glyphMargin: false,
        lineNumbers: "on",
        overviewRulerLanes: 0,
        hideCursorInOverviewRuler: true,
        overviewRulerBorder: false,
        contextmenu: true,
        smoothScrolling: true,
        cursorBlinking: "smooth",
        bracketPairColorization: {
            enabled: true
        },
        guides: {
            indentation: true,
            bracketPairs: true
        },
        scrollbar: {
            verticalScrollbarSize: 7,
            horizontalScrollbarSize: 7,
            useShadows: false
        }
    });

    editor.onDidChangeCursorPosition(function (event) {
        cursorPosition.textContent =
            "Ln " + event.position.lineNumber +
            ", Col " + event.position.column;
    });

    editor.onDidChangeModelContent(function () {
        const tab = getActiveTab();
        if (tab) {
            tab.content = editor.getValue();
        }

        updateLineCount();
    });

    renderTabs();
    updateLineCount();

    window.addEventListener("resize", function () {
        editor.layout();
    });
});

function getActiveTab() {
    return tabs.find(function (tab) {
        return tab.id === activeTabId;
    });
}

function renderTabs() {
    tabsElement.innerHTML = "";

    tabs.forEach(function (tab) {
        const element = document.createElement("div");
        element.className = "tab" +
            (tab.id === activeTabId ? " active" : "");

        const name = document.createElement("span");
        name.className = "tab-name";
        name.textContent = tab.name;
        name.title = "Double-click to rename";

        name.addEventListener("dblclick", function (event) {
            event.stopPropagation();
            renameTab(tab, name);
        });

        const close = document.createElement("span");
        close.className = "tab-close";
        close.textContent = "×";
        close.title = "Close tab";

        close.addEventListener("click", function (event) {
            event.stopPropagation();
            closeTab(tab.id);
        });

        element.appendChild(name);
        element.appendChild(close);

        element.addEventListener("click", function () {
            switchTab(tab.id);
        });

        tabsElement.appendChild(element);
    });
}

function switchTab(id) {
    if (!editor || id === activeTabId) return;

    const current = getActiveTab();
    if (current) {
        current.content = editor.getValue();
    }

    activeTabId = id;

    const next = getActiveTab();
    if (next) {
        editor.setValue(next.content);
        editor.focus();
    }

    renderTabs();
    updateLineCount();
}

function addTab() {
    const current = getActiveTab();
    if (current && editor) {
        current.content = editor.getValue();
    }

    const tab = {
        id: nextId++,
        name: "script" + nextId + ".lua",
        content: ""
    };

    tabs.push(tab);
    activeTabId = tab.id;

    if (editor) {
        editor.setValue("");
        editor.focus();
    }

    renderTabs();
    updateLineCount();
}

function closeTab(id) {
    if (tabs.length === 1) {
        const onlyTab = tabs[0];
        onlyTab.content = "";
        if (editor && activeTabId === id) {
            editor.setValue("");
        }
        renderTabs();
        updateLineCount();
        return;
    }

    const index = tabs.findIndex(function (tab) {
        return tab.id === id;
    });

    if (index === -1) return;

    const wasActive = activeTabId === id;
    tabs.splice(index, 1);

    if (wasActive) {
        const next = tabs[Math.max(0, index - 1)];
        activeTabId = next.id;

        if (editor) {
            editor.setValue(next.content);
        }
    }

    renderTabs();
    updateLineCount();
}

function renameTab(tab, nameElement) {
    const input = document.createElement("input");
    input.className = "rename-input";
    input.value = tab.name;
    input.maxLength = 48;

    nameElement.replaceWith(input);
    input.focus();
    input.select();

    function finishRename() {
        const newName = input.value.trim();
        if (newName) {
            tab.name = newName.endsWith(".lua")
                ? newName
                : newName + ".lua";
        }

        renderTabs();
    }

    input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            finishRename();
        } else if (event.key === "Escape") {
            renderTabs();
        }
    });

    input.addEventListener("blur", finishRename);
}

function updateLineCount() {
    if (!editor) return;

    const lines = editor.getModel().getLineCount();
    lineCount.textContent = lines + (lines === 1 ? " line" : " lines");
}

document.getElementById("add-tab").addEventListener("click", addTab);
</script>
</body>
</html>
