
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
:root {
  color-scheme: dark;
  --bg: #0d0d0d;
  --panel: #111111;
  --border: #292929;
  --text: #dedede;
  --muted: #858585;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: 12px;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid #303030;
  border-radius: 7px;
}

/* Minimal top bar */

.topbar {
  height: 2px;
  min-height: 2px;
  background: #111;
}

/* Tabs */

.tabbar {
  height: 39px;
  min-height: 39px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 5px;
  background: #111;
  border-bottom: 1px solid #242424;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 3px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  height: 29px;
  min-width: 90px;
  max-width: 210px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  color: #aaa;
  white-space: nowrap;
}

.tab:hover {
  background: #1c1c1c;
  color: #ddd;
}

.tab.active {
  background: #202020;
  border-color: #292929;
  color: #eee;
}

.tab-marker {
  font-size: 16px;
  font-weight: 600;
}

.tab-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  outline: none;
}

.tab-close {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 15px;
  height: 15px;
  padding: 0;
  border: 0;
  border-radius: 3px;
  background: transparent;
  color: #888;
  font-size: 16px;
}

.tab-close:hover {
  background: #383838;
  color: white;
}

.add-tab {
  width: 27px;
  height: 27px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #777;
  font-size: 21px;
}

.add-tab:hover {
  background: #222;
  color: #eee;
}

/* Editor takes all remaining space */

.editor-container {
  position: relative;
  flex: 1;
  min-height: 0;
  background: var(--bg);
}

#editor {
  position: absolute;
  inset: 0;
}

/* Small unobtrusive status line */

.statusbar {
  height: 20px;
  min-height: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 9px;
  border-top: 1px solid #222;
  background: #111;
  color: #777;
  font-size: 10px;
}

.status-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.toast-container {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}

.toast {
  padding: 9px 12px;
  border: 1px solid #353535;
  border-radius: 5px;
  background: #1a1a1a;
  color: #ddd;
  animation: toast-in .18s ease both;
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateX(8px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="topbar"></div>

  <div class="tabbar">
    <div class="tabs" id="tabs"></div>

    <button
      class="add-tab"
      id="addTab"
      title="New tab"
      aria-label="New tab">+</button>
  </div>

  <main class="editor-container">
    <div id="editor"></div>
  </main>

  <footer class="statusbar">
    <div class="status-group">
      <span>Lua</span>
      <span id="position">Ln 1, Col 1</span>
    </div>
    <div class="status-group">
      <span id="indent">Spaces: 4</span>
      <span>UTF-8</span>
    </div>
  </footer>

</div>

<div class="toast-container" id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>

<script>
const $ = id => document.getElementById(id);

let editor;
let activeTabId = null;
let nextTabId = 1;

const tabs = [];

function notify(message) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = message;
  $("toasts").appendChild(toast);

  setTimeout(() => {
    toast.style.transition = "opacity .18s, transform .18s";
    toast.style.opacity = "0";
    toast.style.transform = "translateX(8px)";
    setTimeout(() => toast.remove(), 200);
  }, 1800);
}

function createTab(name = "Untitled Tab", content = "") {
  const tab = {
    id: nextTabId++,
    name,
    model: monaco.editor.createModel(content, "lua")
  };

  tabs.push(tab);
  activateTab(tab.id);
  return tab;
}

function renderTabs() {
  const container = $("tabs");
  container.replaceChildren();

  for (const tab of tabs) {
    const button = document.createElement("button");
    button.className =
      "tab" + (tab.id === activeTabId ? " active" : "");

    const marker = document.createElement("span");
    marker.className = "tab-marker";
    marker.textContent = "❝";

    const name = document.createElement("span");
    name.className = "tab-name";
    name.textContent = tab.name;
    name.title = "Double-click to rename";

    name.addEventListener("dblclick", event => {
      event.stopPropagation();
      renameTab(tab.id);
    });

    const close = document.createElement("button");
    close.className = "tab-close";
    close.textContent = "×";
    close.title = "Close tab";
    close.setAttribute("aria-label", "Close tab");

    close.addEventListener("click", event => {
      event.stopPropagation();
      closeTab(tab.id);
    });

    button.append(marker, name, close);
    button.addEventListener("click", () => activateTab(tab.id));

    container.appendChild(button);
  }
}

function activateTab(id) {
  const tab = tabs.find(item => item.id === id);
  if (!tab) return;

  activeTabId = id;
  editor.setModel(tab.model);
  renderTabs();
  updatePosition();
  editor.focus();
}

function closeTab(id) {
  const index = tabs.findIndex(item => item.id === id);
  if (index < 0) return;

  const wasActive = activeTabId === id;
  const [tab] = tabs.splice(index, 1);
  tab.model.dispose();

  if (tabs.length === 0) {
    createTab();
  } else if (wasActive) {
    activateTab(tabs[Math.max(0, index - 1)].id);
  } else {
    renderTabs();
  }
}

function renameTab(id) {
  const tab = tabs.find(item => item.id === id);
  if (!tab) return;

  const name = prompt("Tab name:", tab.name);

  if (name && name.trim()) {
    tab.name = name.trim();
    renderTabs();
  }
}

function updatePosition() {
  if (!editor) return;

  const position = editor.getPosition();
  if (!position) return;

  $("position").textContent =
    `Ln ${position.lineNumber}, Col ${position.column}`;
}

$("addTab").addEventListener("click", () => createTab());

require.config({
  paths: {
    vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
  }
});

require(["vs/editor/editor.main"], function () {
  monaco.languages.register({ id: "lua" });

  monaco.languages.setMonarchTokensProvider("lua", {
    keywords: [
      "and", "break", "do", "else", "elseif", "end",
      "false", "for", "function", "if", "in", "local",
      "nil", "not", "or", "repeat", "return", "then",
      "true", "until", "while"
    ],

    builtins: [
      "assert", "error", "ipairs", "pairs", "pcall",
      "print", "require", "select", "tonumber", "tostring",
      "type", "xpcall", "coroutine", "string", "table",
      "math", "io", "os", "debug"
    ],

    tokenizer: {
      root: [
        [/--\[\[/, "comment", "@longComment"],
        [/--.*$/, "comment"],
        [/"([^"\\]|\\.)*"/, "string"],
        [/'([^'\\]|\\.)*'/, "string"],
        [/\d+(\.\d+)?/, "number"],

        [/[a-zA-Z_]\w*/, {
          cases: {
            "@keywords": "keyword",
            "@builtins": "type.identifier",
            "@default": "identifier"
          }
        }],

        [/[{}()\[\]]/, "@brackets"],
        [/[+\-*\/%^#=<>~]+/, "operator"],
        [/[;,.]/, "delimiter"]
      ],

      longComment: [
        [/[^\]]+/, "comment"],
        [/\]\]/, "comment", "@pop"],
        [/./, "comment"]
      ]
    }
  });

  monaco.languages.registerCompletionItemProvider("lua", {
    triggerCharacters: [".", ":"],

    provideCompletionItems() {
      const items = [
        ["print", "print(${1:value})"],
        ["local", "local ${1:name} = ${2:value}"],
        ["function", "function ${1:name}(${2:args})\n\t${3}\nend"],
        ["if", "if ${1:condition} then\n\t${2}\nend"],
        ["for", "for ${1:i} = ${2:1}, ${3:10} do\n\t${4}\nend"],
        ["pairs", "pairs(${1:table})"],
        ["ipairs", "ipairs(${1:table})"],
        ["return", "return ${1:value}"],
        ["require", "require('${1:module}')"]
      ];

      return {
        suggestions: items.map(([label, insertText]) => ({
          label,
          insertText,
          kind: monaco.languages.CompletionItemKind.Function,
          insertTextRules:
            monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet
        }))
      };
    }
  });

  monaco.editor.defineTheme("dark-custom", {
    base: "vs-dark",
    inherit: true,

    rules: [
      { token: "keyword", foreground: "4FC1E9" },
      { token: "string", foreground: "8DC891" },
      { token: "number", foreground: "B5CEA8" },
      { token: "comment", foreground: "777777", fontStyle: "italic" },
      { token: "type.identifier", foreground: "8DC891" }
    ],

    colors: {
      "editor.background": "#0d0d0d",
      "editor.foreground": "#d4d4d4",
      "editorLineNumber.foreground": "#656565",
      "editorLineNumber.activeForeground": "#c5c5c5",
      "editorCursor.foreground": "#eeeeee",
      "editor.lineHighlightBackground": "#111111",
      "editor.selectionBackground": "#333333",
      "editor.inactiveSelectionBackground": "#252525",
      "editorIndentGuide.background1": "#222222",
      "editorIndentGuide.activeBackground1": "#444444",
      "editorWidget.background": "#161616",
      "editorWidget.border": "#303030",
      "focusBorder": "#454545"
    }
  });

  editor = monaco.editor.create($("editor"), {
    model: null,
    theme: "dark-custom",
    automaticLayout: true,
    fontFamily: "Consolas, monospace",
    fontSize: 14,
    lineNumbers: "on",
    lineNumbersMinChars: 3,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    smoothScrolling: true,
    cursorSmoothCaretAnimation: "on",
    cursorBlinking: "smooth",
    renderLineHighlight: "line",
    roundedSelection: false,
    wordWrap: "off",
    tabSize: 4,
    insertSpaces: true,
    padding: { top: 10, bottom: 8 },
    folding: true,
    glyphMargin: false,
    overviewRulerBorder: false,
    hideCursorInOverviewRuler: true,
    scrollbar: {
      verticalScrollbarSize: 8,
      horizontalScrollbarSize: 8,
      useShadows: false
    },
    quickSuggestions: true,
    parameterHints: { enabled: true }
  });

  editor.onDidChangeCursorPosition(updatePosition);

  createTab();

  $("indent").textContent = "Spaces: 4";
});
</script>
</body>
</html>
