<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lua Editor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;opacity:0;animation:boot .7s .1s ease forwards}
@keyframes boot{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* tab bar */
#bar{display:flex;align-items:stretch;border-bottom:1px solid #161616;background:#000;flex:none;height:40px}
#tabs{position:relative;display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:0 1 auto;max-width:calc(100% - 44px)}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;height:40px;color:#6b6b6b;cursor:pointer;white-space:nowrap;font-size:13px;border-right:1px solid #0e0e0e;max-width:220px;overflow:hidden;transition:color .2s,background .2s;animation:tabIn .28s cubic-bezier(.2,.9,.3,1.2) both}
.tab:hover{color:#bbb;background:#080808}
.tab.active{color:#fff;background:#060606}
.tab.closing{animation:tabOut .22s ease forwards}
@keyframes tabIn{from{opacity:0;transform:translateY(-10px) scale(.92)}to{opacity:1;transform:none}}
@keyframes tabOut{to{opacity:0;max-width:0;padding-left:0;padding-right:0;transform:scale(.9)}}
.tab .dot{width:7px;height:7px;border-radius:50%;background:#4aa3ff;flex:none;opacity:.9}
.tab .name{overflow:hidden;text-overflow:ellipsis;user-select:none}
.tab input{all:unset;width:110px;color:#fff;border-bottom:1px solid #4aa3ff;font-size:13px;padding:1px 0}
.tab .x{all:unset;cursor:pointer;width:18px;height:18px;line-height:18px;text-align:center;border-radius:5px;font-size:15px;color:#666;opacity:0;transition:opacity .15s,background .15s,color .15s;flex:none}
.tab:hover .x,.tab.active .x{opacity:1}
.tab .x:hover{background:#1c1c1c;color:#fff}
#ind{position:absolute;bottom:0;height:2px;background:#4aa3ff;border-radius:2px;box-shadow:0 0 10px #4aa3ff;transition:left .28s cubic-bezier(.3,.9,.3,1),width .28s cubic-bezier(.3,.9,.3,1);left:0;width:0}
#add{all:unset;cursor:pointer;width:44px;flex:none;text-align:center;font-size:20px;color:#666;transition:color .2s,transform .25s}
#add:hover{color:#fff;transform:rotate(90deg)}
.tab:focus-visible,#add:focus-visible,.x:focus-visible{outline:1px solid #4aa3ff;outline-offset:-2px}

/* editor */
#wrap{flex:1;min-height:0;position:relative;background:#000}
#ed{position:absolute;inset:0;transition:opacity .18s ease,transform .18s ease}
#ed.swap{opacity:0;transform:translateX(10px)}
#status{display:flex;gap:18px;align-items:center;flex:none;height:24px;padding:0 14px;font-size:12px;color:#666;border-top:1px solid #161616;background:#000}
#status .sp{margin-left:auto}
#status b{font-weight:500;color:#9a9a9a}
#hint{position:absolute;right:16px;bottom:14px;font-size:12px;color:#555;pointer-events:none;animation:fade 6s 1.5s ease forwards;opacity:0;z-index:5}
@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div id="tabs" role="tablist"><div id="ind"></div></div>
    <button id="add" type="button" aria-label="New tab" title="New tab (Alt+N)">+</button>
  </div>
  <div id="wrap"><div id="ed"></div><div id="hint">Double-click a tab to rename · Alt+N new · Alt+W close</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
var BASE='https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
window.MonacoEnvironment={getWorkerUrl:function(){
  return 'data:text/javascript;charset=utf-8,'+encodeURIComponent("self.MonacoEnvironment={baseUrl:'"+BASE+"/'};importScripts('"+BASE+"/vs/base/worker/workerMain.js');");
}};
require.config({paths:{vs:BASE+'/vs'}});

var SAMPLE_MAIN=[
'-- Welcome to the Lua editor',
'local Player = {}',
'Player.__index = Player',
'',
'function Player.new(name, hp)',
'  return setmetatable({ name = name, hp = hp or 100 }, Player)',
'end',
'',
'function Player:damage(amount)',
'  self.hp = math.max(0, self.hp - amount)',
'  if self.hp == 0 then',
'    print(self.name .. " has fallen")',
'  end',
'end',
'',
'local hero = Player.new("Ada")',
'for i = 1, 3 do',
'  hero:damage(i * 20)',
'  print(string.format("%s: %d hp", hero.name, hero.hp))',
'end',''].join('\n');
var SAMPLE_UTIL='-- helpers\nlocal M = {}\n\nfunction M.map(t, fn)\n  local out = {}\n  for i, v in ipairs(t) do out[i] = fn(v) end\n  return out\nend\n\nreturn M\n';

var KEY='lua-editor-tabs-v2';
require(['vs/editor/editor.main'],function(){
  monaco.editor.defineTheme('void',{base:'vs-dark',inherit:true,
    rules:[
      {token:'comment',foreground:'5c6370',fontStyle:'italic'},
      {token:'keyword',foreground:'c678dd'},
      {token:'string',foreground:'98c379'},
      {token:'number',foreground:'d19a66'},
      {token:'identifier',foreground:'e6e6e6'},
      {token:'delimiter',foreground:'8a8f98'},
      {token:'predefined',foreground:'61afef'}
    ],
    colors:{
      'editor.background':'#000000','editorGutter.background':'#000000',
      'editor.lineHighlightBackground':'#0c0c0c','editor.lineHighlightBorder':'#00000000',
      'editorLineNumber.foreground':'#3d3d3d','editorLineNumber.activeForeground':'#a0a0a0',
      'editor.selectionBackground':'#1d4f8a88','editorCursor.foreground':'#ffffff',
      'editorIndentGuide.background1':'#141414','editorIndentGuide.activeBackground1':'#2c2c2c',
      'minimap.background':'#000000','scrollbarSlider.background':'#ffffff14','scrollbarSlider.hoverBackground':'#ffffff26',
      'editorWidget.background':'#080808','editorSuggestWidget.background':'#080808','editorSuggestWidget.border':'#1a1a1a',
      'focusBorder':'#00000000'
    }});
  var editor=monaco.editor.create(document.getElementById('ed'),{
    model:null,theme:'void',automaticLayout:true,fontSize:14,lineHeight:22,
    fontFamily:'"JetBrains Mono","Fira Code",Menlo,Consolas,monospace',fontLigatures:true,
    minimap:{enabled:false},smoothScrolling:true,cursorBlinking:'smooth',cursorSmoothCaretAnimation:'on',
    padding:{top:14},scrollBeyondLastLine:false,renderLineHighlight:'all',roundedSelection:true,
    bracketPairColorization:{enabled:true}
  });

  var tabsEl=document.getElementById('tabs'),ind=document.getElementById('ind'),edEl=document.getElementById('ed');
  var tabs=[],active=null,n=0;

  function save(){
    try{localStorage.setItem(KEY,JSON.stringify({a:active,t:tabs.map(function(t){return{id:t.id,name:t.name,text:t.model.getValue()}})}))}catch(e){}
  }
  var st;function saveSoon(){clearTimeout(st);st=setTimeout(save,300)}

  function moveInd(){
    var t=tabs.filter(function(x){return x.id===active})[0];
    if(!t||!t.el){ind.style.width='0';return}
    ind.style.left=t.el.offsetLeft+'px';ind.style.width=t.el.offsetWidth+'px';
  }
  function trackInd(){var s=performance.now();(function f(){moveInd();if(performance.now()-s<420)requestAnimationFrame(f)})()}

  function updateStatus(){}

  function activate(id,instant){
    var t=tabs.filter(function(x){return x.id===id})[0];if(!t)return;
    var cur=tabs.filter(function(x){return x.id===active})[0];
    if(cur&&cur!==t)cur.view=editor.saveViewState();
    active=id;
    tabs.forEach(function(x){x.el.classList.toggle('active',x.id===id);x.el.setAttribute('aria-selected',x.id===id)});
    function swap(){editor.setModel(t.model);if(t.view)editor.restoreViewState(t.view);editor.focus();edEl.classList.remove('swap');updateStatus()}
    if(instant||cur===t){swap()}else{edEl.classList.add('swap');setTimeout(swap,140)}
    t.el.scrollIntoView({inline:'nearest',block:'nearest'});
    trackInd();save();
  }

  function startRename(t){
    var nameEl=t.el.querySelector('.name');if(!nameEl)return;
    var inp=document.createElement('input');inp.value=t.name;inp.setAttribute('aria-label','Tab name');
    nameEl.replaceWith(inp);inp.focus();
    var dot=t.name.lastIndexOf('.');inp.setSelectionRange(0,dot>0?dot:t.name.length);
    var done=false;
    function finish(ok){
      if(done)return;done=true;
      var v=inp.value.trim().replace(/[\/\\]/g,'');
      if(ok&&v)t.name=v;
      var sp=document.createElement('span');sp.className='name';sp.textContent=t.name;
      inp.replaceWith(sp);updateStatus();trackInd();save();editor.focus();
    }
    inp.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')finish(true);if(e.key==='Escape')finish(false)});
    inp.addEventListener('blur',function(){finish(true)});
    inp.addEventListener('click',function(e){e.stopPropagation()});
    inp.addEventListener('dblclick',function(e){e.stopPropagation()});
    trackInd();
  }

  function addTab(name,text,id,noActivate){
    id=id||('t'+(++n)+'_'+Date.now());
    if(!name){var k=1;var names=tabs.map(function(x){return x.name});while(names.indexOf('untitled'+k+'.lua')>-1)k++;name='untitled'+k+'.lua'}
    var model=monaco.editor.createModel(text||'','lua');
    model.onDidChangeContent(saveSoon);
    var el=document.createElement('div');el.className='tab';el.setAttribute('role','tab');el.tabIndex=0;
    el.innerHTML='<span class="dot"></span><span class="name"></span><button class="x" type="button" aria-label="Close tab">×</button>';
    el.querySelector('.name').textContent=name;
    var t={id:id,name:name,model:model,el:el};tabs.push(t);
    tabsEl.appendChild(el);
    el.addEventListener('click',function(){activate(id)});
    el.addEventListener('dblclick',function(){startRename(t)});
    el.addEventListener('keydown',function(e){if(e.target===el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();activate(id)}});
    el.querySelector('.x').addEventListener('click',function(e){e.stopPropagation();closeTab(id)});
    el.addEventListener('auxclick',function(e){if(e.button===1)closeTab(id)});
    if(!noActivate)activate(id);
    trackInd();return t;
  }

  function closeTab(id){
    var i=tabs.findIndex(function(x){return x.id===id});if(i<0)return;
    var t=tabs[i];tabs.splice(i,1);
    t.el.classList.add('closing');
    var wasActive=(active===id);
    setTimeout(function(){t.el.remove();if(t.model.dispose)t.model.dispose();trackInd();save()},230);
    if(!tabs.length){addTab(null,'');return}
    if(wasActive){active=null;activate(tabs[Math.min(i,tabs.length-1)].id)}
    trackInd();
  }

  // restore or seed
  var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(saved&&saved.t&&saved.t.length){
    saved.t.forEach(function(s){addTab(s.name,s.text,s.id,true)});
    activate((saved.a&&tabs.some(function(x){return x.id===saved.a}))?saved.a:tabs[0].id,true);
  }else{
    addTab('main.lua','',null,true);
    activate(tabs[0].id,true);
  }

  document.getElementById('add').addEventListener('click',function(){addTab()});
  editor.onDidChangeCursorPosition(updateStatus);
  editor.onDidChangeCursorSelection(updateStatus);
  window.addEventListener('resize',trackInd);
  tabsEl.addEventListener('scroll',moveInd);
  window.addEventListener('keydown',function(e){
    if(!e.altKey)return;
    var k=e.key.toLowerCase();
    if(k==='n'){e.preventDefault();addTab()}
    else if(k==='w'){e.preventDefault();closeTab(active)}
    else if(k==='r'){e.preventDefault();var t=tabs.filter(function(x){return x.id===active})[0];if(t)startRename(t)}
  });
  // API for the host app (WinForms WebView2)
  window.editorApi={
    getText:function(){return editor.getValue()},
    getName:function(){var t=tabs.filter(function(x){return x.id===active})[0];return t?t.name:''},
    setText:function(text,name){
      var t=tabs.filter(function(x){return x.id===active})[0];if(!t)return;
      t.model.setValue(text||'');editor.setScrollTop(0);editor.setPosition({lineNumber:1,column:1});
      if(name){t.name=name;var ne=t.el.querySelector('.name');if(ne)ne.textContent=name;trackInd()}
      save();
    },
    clear:function(){editor.setValue('');editor.focus()}
  };
  setTimeout(trackInd,60);
});
</script>
</body>
</html>
